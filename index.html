<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core & Conditioning Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.15);
            --rest-color: #f59e0b;
            --rest-bg: rgba(245, 158, 11, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --success: #16a34a;
            --success-bg: rgba(22, 163, 74, 0.15);
            --rest-color: #d97706;
            --rest-bg: rgba(217, 119, 6, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 70px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-top: 8px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 2px;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #ffffff;
            border-color: transparent;
        }

        /* Heatmap - Scrollbars Hidden */
        .heatmap-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 14px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .heatmap-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .heatmap-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .heatmap-grid {
            display: flex;
            gap: 5px;
            min-width: max-content;
        }

        .heatmap-cell {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .heatmap-cell.done {
            background-color: var(--success);
            color: white;
        }

        .heatmap-cell.rest {
            background-color: var(--rest-color);
            color: white;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-card.full-width {
            grid-column: span 1;
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .progress-bar-container {
            background-color: var(--card-border);
            border-radius: 9999px;
            height: 8px;
            width: 100%;
            margin-top: 6px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Filters - Scrollbars Hidden */
        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .filters::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            min-height: 34px;
        }

        .filter-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: transparent;
        }

        /* Grid Feed Layout */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .day-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .day-header {
            padding: 12px 14px;
            background-color: rgba(0,0,0,0.02);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            min-height: 48px;
        }

        .day-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .day-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-rest {
            background-color: var(--rest-bg);
            color: var(--rest-color);
        }

        .badge-workout {
            background-color: var(--success-bg);
            color: var(--success);
        }

        .exercise-list {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            background-color: rgba(128,128,128,0.04);
            border: 1px solid transparent;
            min-height: 52px;
        }

        .exercise-item.completed {
            background-color: var(--success-bg);
            border-color: rgba(34, 197, 94, 0.2);
        }

        .exercise-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 8px;
        }

        .exercise-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .exercise-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .rest-badge-btn {
            background: var(--rest-bg);
            color: var(--rest-color);
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            min-height: 28px;
        }

        .exercise-checkbox {
            appearance: none;
            width: 26px;
            height: 26px;
            border: 2px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background-color: var(--card-bg);
            flex-shrink: 0;
        }

        .exercise-checkbox:checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        .exercise-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .rest-day-content {
            padding: 16px;
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.9rem;
        }

        .day-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0,0,0,0.02);
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-height: 44px;
        }

        .complete-day-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 6px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            margin: 16px 0;
            font-variant-numeric: tabular-nums;
        }

        .modal input, .modal textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* Bottom Dock */
        .mobile-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 99;
        }

        .dock-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .dock-btn span {
            font-size: 1.1rem;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <header>
            <div>
                <h1>Core Tracker</h1>
                <div class="header-subtitle">42-Day Program Dashboard with Timers & Journal</div>
            </div>
            <div class="header-controls">
                <button class="btn" id="themeToggle" title="Toggle Theme">🌓</button>
                <button class="btn" id="resetData" title="Reset Data">🔄</button>
            </div>
        </header>

        <!-- Heatmap -->
        <div class="heatmap-container">
            <div class="heatmap-title">42-Day Streak Map</div>
            <div class="heatmap-grid" id="heatmapGrid"></div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card full-width">
                <div class="stat-title">Overall Progress</div>
                <div class="stat-value" id="completionText">0%</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Completed</div>
                <div class="stat-value"><span id="completedCount">0</span>/42</div>
            </div>
            <div class="stat-card" id="weightCardMobile" style="display: none;">
                <div class="stat-title">Weight</div>
                <div class="stat-value" id="bodyWeightDisplay">-- kg</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Days</button>
            <button class="filter-btn" data-filter="workout">Workouts</button>
            <button class="filter-btn" data-filter="rest">Rests</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Done</button>
        </div>

        <!-- Main Cards Feed -->
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- Bottom Dock -->
    <nav class="mobile-dock">
        <button class="dock-btn" id="exportDock"><span>📥</span>Export</button>
        <label class="dock-btn" style="cursor: pointer;">
            <span>📤</span>Import <input type="file" id="importFile" accept=".json" style="display: none;">
        </label>
        <button class="dock-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})"><span>⬆️</span>Top</button>
    </nav>

    <!-- Rest Timer Modal -->
    <div class="modal-overlay" id="timerModal">
        <div class="modal">
            <h3 style="font-size: 1.2rem;">Rest Timer</h3>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-primary" id="stopTimerBtn" style="width: 100%;">Skip / Close</button>
            </div>
        </div>
    </div>

    <!-- Journal & Weight Modal -->
    <div class="modal-overlay" id="journalModal">
        <div class="modal" style="text-align: left;">
            <h3 id="modalDayTitle" style="font-size: 1.1rem; margin-bottom: 12px;">Day Log</h3>
            <label style="font-size: 0.8rem; color: var(--text-secondary);">Body Weight (kg)</label>
            <input type="number" id="dayWeightInput" step="0.1" placeholder="e.g. 61.5">
            <label style="font-size: 0.8rem; color: var(--text-secondary);">Workout Notes / RPE</label>
            <textarea id="dayNotesInput" rows="3" placeholder="How did it feel?"></textarea>
            <div class="modal-actions">
                <button class="btn" id="closeJournalBtn">Cancel</button>
                <button class="btn btn-primary" id="saveJournalBtn">Save</button>
            </div>
        </div>
    </div>

        let programData = JSON.parse(localStorage.getItem('fitnessProgramData')) || rawData;
        let dayMetadata = JSON.parse(localStorage.getItem('fitnessDayMetadata')) || {};
        let currentFilter = 'all';
        let activeTimerInterval = null;
        let activeJournalDay = null;

        function saveState() {
            localStorage.setItem('fitnessProgramData', JSON.stringify(programData));
            localStorage.setItem('fitnessDayMetadata', JSON.stringify(dayMetadata));
            updateStats();
            renderHeatmap();
        }

        function updateStats() {
            const totalDays = 42;
            let completedDaysCount = 0;

            for (let d = 1; d <= totalDays; d++) {
                const dayItems = programData.filter(item => item.day === d);
                if (dayItems.length > 0 && dayItems.every(item => item.status === 'DONE')) {
                    completedDaysCount++;
                }
            }

            const percent = Math.round((completedDaysCount / totalDays) * 100);
            document.getElementById('completionText').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('completedCount').innerText = completedDaysCount;

            let latestWeight = null;
            for (let d = 42; d >= 1; d--) {
                if (dayMetadata[d] && dayMetadata[d].weight) {
                    latestWeight = dayMetadata[d].weight;
                    break;
                }
            }
            if (!latestWeight) {
                const itemWithWeight = programData.find(item => item.weight && item.status === 'DONE');
                if (itemWithWeight) latestWeight = itemWithWeight.weight;
            }

            const weightCard = document.getElementById('weightCardMobile');
            if (latestWeight) {
                weightCard.style.display = 'block';
                document.getElementById('bodyWeightDisplay').innerText = `${latestWeight} kg`;
            } else {
                weightCard.style.display = 'none';
            }

            if (percent === 100 && completedDaysCount === 42) triggerConfetti();
        }

        function renderHeatmap() {
            const grid = document.getElementById('heatmapGrid');
            grid.innerHTML = '';
            for (let d = 1; d <= 42; d++) {
                const dayItems = programData.filter(item => item.day === d);
                const isRest = dayItems.length === 1 && dayItems[0].exercise.includes('REST');
                const allDone = dayItems.length > 0 && dayItems.every(item => item.status === 'DONE');

                const cell = document.createElement('a');
                cell.className = 'heatmap-cell';
                cell.innerText = d;
                cell.href = `#day-${d}`;
                if (allDone) cell.classList.add('done');
                else if (isRest) cell.classList.add('rest');
                grid.appendChild(cell);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let d = 1; d <= 42; d++) {
                const dayItems = programData.filter(item => item.day === d);
                if (dayItems.length === 0) continue;

                const isRest = dayItems.length === 1 && dayItems[0].exercise.includes('REST');
                const allDone = dayItems.every(item => item.status === 'DONE');
                const meta = dayMetadata[d] || {};

                if (currentFilter === 'workout' && isRest) continue;
                if (currentFilter === 'rest' && !isRest) continue;
                if (currentFilter === 'pending' && allDone) continue;
                if (currentFilter === 'completed' && !allDone) continue;

                const card = document.createElement('div');
                card.className = 'day-card';
                card.id = `day-${d}`;

                let headerHTML = `
                    <div class="day-header" onclick="openJournal(${d})">
                        <span class="day-title">Day ${d} ${meta.weight ? `⚖️ ${meta.weight}kg` : ''}</span>
                        <span class="day-badge ${isRest ? 'badge-rest' : 'badge-workout'}">${isRest ? 'Rest' : `${dayItems.length} Ex`}</span>
                    </div>
                `;

                let bodyHTML = `<div class="exercise-list">`;
                if (isRest) {
                    bodyHTML += `<div class="rest-day-content">Recovery & Rest Day. Take it easy!</div>`;
                } else {
                    dayItems.forEach((item, index) => {
                        let restSeconds = parseInt(item.rest) || 0;
                        bodyHTML += `
                            <div class="exercise-item ${item.status === 'DONE' ? 'completed' : ''}">
                                <div class="exercise-info">
                                    <span class="exercise-name">${item.exercise}</span>
                                    <span class="exercise-meta">
                                        <span>Sets: ${item.sets}</span> • 
                                        <span>Reps: ${item.reps}</span>
                                        ${restSeconds > 0 ? `• <button class="rest-badge-btn" onclick="startTimer(${restSeconds}, event)">⏱ ${item.rest}</button>` : ''}
                                    </span>
                                </div>
                                <input type="checkbox" class="exercise-checkbox" ${item.status === 'DONE' ? 'checked' : ''} 
                                    onchange="toggleExercise(${d}, ${index}, this.checked)">
                            </div>
                        `;
                    });
                }
                if (meta.notes) {
                    bodyHTML += `<div style="font-size: 0.75rem; color: var(--text-secondary); background: rgba(0,0,0,0.05); padding: 6px 10px; border-radius: 6px; margin-top: 2px;">📝 ${meta.notes}</div>`;
                }
                bodyHTML += `</div>`;

                let footerHTML = `
                    <div class="day-footer">
                        <span style="font-size: 0.7rem;">${meta.weight ? `Wt: ${meta.weight}kg` : 'Tap header to log'}</span>
                        <button class="complete-day-btn" onclick="toggleCompleteDay(${d})">
                            ${allDone ? '↺ Incomplete' : '✔ Complete Day'}
                        </button>
                    </div>
                `;

                card.innerHTML = headerHTML + bodyHTML + footerHTML;
                grid.appendChild(card);
            }
        }

        window.toggleExercise = function(day, exerciseIndex, isChecked) {
            const dayItems = programData.filter(item => item.day === day);
            const targetItem = dayItems[exerciseIndex];
            const globalIndex = programData.findIndex(item => item === targetItem);
            if (globalIndex !== -1) {
                programData[globalIndex].status = isChecked ? 'DONE' : 'PENDING';
                saveState();
                renderGrid();
            }
        };

        window.toggleCompleteDay = function(day) {
            const dayItems = programData.filter(item => item.day === day);
            const allDone = dayItems.every(item => item.status === 'DONE');
            const newStatus = allDone ? 'PENDING' : 'DONE';

            programData.forEach(item => {
                if (item.day === day) item.status = newStatus;
            });
            saveState();
            renderGrid();
        };

        window.startTimer = function(seconds, event) {
            event.stopPropagation();
            const modal = document.getElementById('timerModal');
            modal.classList.add('active');

            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            if (activeTimerInterval) clearInterval(activeTimerInterval);

            activeTimerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);
                if (timeLeft <= 0) {
                    clearInterval(activeTimerInterval);
                    playBeep();
                    setTimeout(() => modal.classList.remove('active'), 1000);
                }
            }, 1000);
        };

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        document.getElementById('stopTimerBtn').addEventListener('click', () => {
            if (activeTimerInterval) clearInterval(activeTimerInterval);
            document.getElementById('timerModal').classList.remove('active');
        });

        window.openJournal = function(day) {
            activeJournalDay = day;
            const meta = dayMetadata[day] || {};
            document.getElementById('modalDayTitle').innerText = `Day ${day} Journal & Weight`;
            document.getElementById('dayWeightInput').value = meta.weight || '';
            document.getElementById('dayNotesInput').value = meta.notes || '';
            document.getElementById('journalModal').classList.add('active');
        };

        document.getElementById('closeJournalBtn').addEventListener('click', () => {
            document.getElementById('journalModal').classList.remove('active');
        });

        document.getElementById('saveJournalBtn').addEventListener('click', () => {
            if (!activeJournalDay) return;
            const weight = document.getElementById('dayWeightInput').value;
            const notes = document.getElementById('dayNotesInput').value;

            if (!dayMetadata[activeJournalDay]) dayMetadata[activeJournalDay] = {};
            dayMetadata[activeJournalDay].weight = weight;
            dayMetadata[activeJournalDay].notes = notes;

            saveState();
            document.getElementById('journalModal').classList.remove('active');
            renderGrid();
        });

        document.getElementById('exportDock').addEventListener('click', () => {
            const exportObj = { programData, dayMetadata };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `fitness_progress.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        document.getElementById('importFile').addEventListener('change', (e) => {
            const fileReader = new FileReader();
            if (e.target.files[0]) {
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.programData) {
                            programData = parsed.programData;
                            dayMetadata = parsed.dayMetadata || {};
                            saveState();
                            renderGrid();
                            alert('Imported successfully!');
                        }
                    } catch (err) { alert('Invalid file'); }
                };
            }
        });

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 4,
                    color: ['#38bdf8', '#22c55e', '#f59e0b', '#ec4899'][Math.floor(Math.random() * 4)],
                    size: Math.random() * 6 + 3
                });
            }
            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.25;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                particles = particles.filter(p => p.y < canvas.height);
                if (particles.length > 0) requestAnimationFrame(loop);
            }
            loop();
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderGrid();
            });
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

        document.getElementById('resetData').addEventListener('click', () => {
            if (confirm('Reset all progress?')) {
                programData = JSON.parse(JSON.stringify(rawData));
                dayMetadata = {};
                saveState();
                renderGrid();
            }
        });

        updateStats();
        renderHeatmap();
        renderGrid();
    </script>
</body>
</html>
